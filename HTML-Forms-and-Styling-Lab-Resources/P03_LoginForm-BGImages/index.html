<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Form Background Images</title>
  <link rel="stylesheet" href="login-form-bg.css">
</head>
<body>
  <main>
    <h1>Flat Business Profile Widget</h1>

    
    <div class="image-container">
      <img src="images/image-photo.jpg" alt="Profile Image">
    </div>

    
    <div class="input-container">
      <input type="text" placeholder="Name" class="user-input">
    </div>

    
    <div class="input-container">
      <input type="password" placeholder="*******" class="pass-input">
    </div>

  
    <input type="submit" value="Submit">

    
    <footer>
      © 2016 Flat Business Profile Widget. All rights reserved
    </footer>
  </main>
</body>
</html>
