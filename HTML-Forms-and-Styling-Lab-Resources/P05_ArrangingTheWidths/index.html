<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arranging the Widths</title>
  <link rel="stylesheet" href="arranging-the-widths.css">
</head>
<body>
  <main>
    <h1>Rent Audi Vehicles</h1>

    <form>
     
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Enter your name" required>

      
      <label for="car">Select:</label>
      <select id="car">
        <option>Audi 80</option>
        <option>Audi R8</option>
        <option>Audi Q7</option>
      </select>

     
      <label for="message">Message:</label>
      <textarea id="message" placeholder="Your message"></textarea>

      
      <input type="submit" value="Send">
    </form>
  </main>
</body>
</html>
